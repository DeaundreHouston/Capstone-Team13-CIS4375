<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Day | Order Status</title>
    <style>
        :root {
            --primary-color: #9575CD; /* Soft Purple */
            --gray-light: #e0e0e0;    /* Unfinished Grey */
            --gray-dark: #7f8c8d;
            --text-main: #2f3542;
            --progress-width: 0%;    /* DYNAMIC: Controlled by JS */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f2f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #FFFACD; /* Your Light Yellow Theme */
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        h2 { 
            text-align: center; 
            color: var(--text-main); 
            margin-bottom: 30px; 
            font-size: 28px; 
            font-weight: 800;
        }

        /* Progress Bar Styling */
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 50px;
            position: relative;
        }

        /* THE DYNAMIC CONNECTING LINE */
        .status-bar::before {
            content: '';
            position: absolute;
            top: 18px;
            left: 0;
            right: 0;
            height: 4px;
            /* Linear gradient creates the "fill" effect */
            background: linear-gradient(to right, 
                var(--primary-color) var(--progress-width), 
                var(--gray-light) var(--progress-width)
            );
            z-index: 1;
            transition: all 0.5s ease;
        }

        .status-step { 
            text-align: center; 
            z-index: 2; 
            width: 25%; 
        }

        .circle {
            width: 40px;
            height: 40px;
            background: var(--gray-light);
            border-radius: 50%;
            margin: 0 auto 10px;
            line-height: 40px;
            font-weight: bold;
            color: white;
            transition: all 0.4s ease;
            position: relative;
        }

        .status-step p { 
            margin: 0; 
            font-size: 14px; 
            color: var(--gray-dark); 
            transition: color 0.4s ease;
        }

        /* Purple Styling for Completed and Active steps */
        .status-step.active .circle, 
        .status-step.completed .circle { 
            background: var(--primary-color); 
        }

        .status-step.active p, 
        .status-step.completed p { 
            color: var(--primary-color); 
            font-weight: bold; 
        }

        /* Current step "Pop" */
        .status-step.active .circle {
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(149, 117, 205, 0.4);
        }

        /* Receipt Section */
        #receipt {
            border-top: 2px dashed var(--gray-light);
            padding-top: 25px;
            margin-top: 20px;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            color: var(--gray-dark);
            font-size: 14px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
            color: var(--text-main);
        }

        .total-row {
            border-top: 2px solid var(--text-main);
            padding-top: 15px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }

        .alert-canceled {
            background-color: #ffeaa7;
            color: #d35400;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="order-title">Order #---</h2>
    <div id="status-alert"></div>

    <div class="status-bar">
        <div class="status-step" id="step-pending"><div class="circle">1</div><p>Pending</p></div>
        <div class="status-step" id="step-confirmed"><div class="circle">2</div><p>Confirmed</p></div>
        <div class="status-step" id="step-prep"><div class="circle">3</div><p>In Prep</p></div>
        <div class="status-step" id="step-ready"><div class="circle">4</div><p>Ready!</p></div>
    </div>

    <div id="receipt">
        <div class="receipt-header">
            <span>Customer: <strong id="cust-name" style="color: #2f3542;">---</strong></span>
            <span id="order-date"></span>
        </div>
        <div id="item-list"></div>
        <div class="total-row">
            <span>Total</span>
            <span id="total-price">$0.00</span>
        </div>
    </div>
</div>

<script>
    const API_INVOKE_URL = "https://1p13n3k8d5.execute-api.us-east-1.amazonaws.com/test";
    const urlParams = new URLSearchParams(window.location.search);
    const orderID = urlParams.get('orderID');

    async function fetchOrderStatus() {
        if (!orderID) return;
        try {
            const response = await fetch(`${API_INVOKE_URL}/customer/order/${orderID}`);
            const data = await response.json();
            if (response.status === 200) updateUI(data);
        } catch (error) {
            console.error("Connection Error:", error);
        }
    }

    function updateUI(data) {
        document.getElementById('order-title').innerText = `Order #${data.orderId}`;
        document.getElementById('cust-name').innerText = data.customerName;
        document.getElementById('total-price').innerText = `$${data.total}`;
        document.getElementById('order-date').innerText = new Date(data.date).toLocaleDateString();

        const alertBox = document.getElementById('status-alert');
        if (data.status === "Canceled") {
            alertBox.innerHTML = `<div class="alert-canceled">This order was Canceled</div>`;
        } else {
            alertBox.innerHTML = "";
        }

        resetProgressBar();
        const status = data.status.toLowerCase();

        // LOGIC: Set status classes AND update the gradient width
        if (status === "pending") {
            activateStep("step-pending");
            updateLine(12.5); // Fill up to Circle 1
        } 
        else if (status === "confirmed") {
            completeStep("step-pending");
            activateStep("step-confirmed");
            updateLine(37.5); // Fill halfway between 1 & 2
        } 
        else if (status === "in prep" || status === "preparing") {
            completeStep("step-pending");
            completeStep("step-confirmed");
            activateStep("step-prep");
            updateLine(62.5); // Fill halfway between 2 & 3
        } 
        else if (status === "ready" || status === "completed") {
            completeStep("step-pending");
            completeStep("step-confirmed");
            completeStep("step-prep");
            activateStep("step-ready");
            updateLine(100);  // Full Bar
        }

        const list = document.getElementById('item-list');
        list.innerHTML = data.items.map(item => `
            <div class="item-row">
                <span>${item.quantity}x ${item.name}</span>
                <span>$${(item.price * item.quantity).toFixed(2)}</span>
            </div>
        `).join('');
    }

    // Helper to update the CSS variable for the gradient line
    function updateLine(percentage) {
        document.documentElement.style.setProperty('--progress-width', percentage + '%');
    }

    function resetProgressBar() {
        document.querySelectorAll('.status-step').forEach(step => {
            step.classList.remove('active', 'completed');
        });
    }

    function activateStep(id) { document.getElementById(id).classList.add('active'); }
    function completeStep(id) { document.getElementById(id).classList.add('completed'); }

    fetchOrderStatus();
    setInterval(fetchOrderStatus, 15000);
</script>

</body>
</html>
